[package]
name = "github-tui"
version = "0.1.0"
description = "A read-only terminal UI for browsing GitHub repositories, issues, and pull requests"
authors = ["user-64bit <arth.prajapati@outlook.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[dependencies]
ratatui = "0.30.0"
color-eyre = "0.6.5"
# Blocking HTTP with rustls (no OpenSSL); run on worker threads, not an async runtime.
ureq = { version = "3.3", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
